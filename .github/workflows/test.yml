# test.yml — the falsifiers get a pulse (born 2026-08-25, POS-55 review's flag:
# "a falsifier nobody runs cannot fail" — this repo had no test CI at all).
# Non-required by design: it reports, it does not yet gate. Making it a
# required check is a repo-settings act and the founder's call, once this has
# run green for a while on real traffic.
#
# THE BUILD ON EVERY PULL REQUEST (2026-10-07, Darko: no heavy local runs while
# the meeps run on the operator's machine). A site PR's build was proven only
# after it merged (deploy.yml's snapshot lane, on the train push) or by a local
# `npm run build` in a pool tree, and local heavy runs make the meeps' Letta
# server late enough to skip whole minutes of rounds. The `build` job below is
# the snapshot lane's build without the rsync: the same install, the same read
# of the town from the public API, the same `npm run build`, and nothing
# deployed. It needs no secret. The `built-pages` job (POS-670) builds again
# from the committed data and runs the full suite against that build.
# `workflow_dispatch` grades any branch on demand
# (`gh workflow run test -R postmark-town/postmark-site --ref <branch>`).
name: test
on:
  push:
    branches: ["main", "train/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # THE TOWN CHECKOUT (2026-09-04). test/extract-seam.test.mjs runs its
      # funding-seam controls against a live Town and SKIPS without one — so this
      # job stayed green for nine days (08-26 → 09-04) while the same suite was red
      # on every box that had a Town, and the Worldkeeper withdrew S56's site pin
      # on it. The Town is public; a shallow clone into the path the test already
      # looks at (".postmark-checkout", sync-atlas.yml's own name) makes the 600
      # controls run here on every push.
      - name: Check the Town out beside the site (the funding seam's other half)
        run: git clone --depth 1 https://github.com/postmark-town/postmark.git .postmark-checkout
      - run: npm test

  # Pull requests and on-demand runs only: a push to a train already builds in
  # deploy.yml's snapshot lane, and a push to main in its release lane.
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Read-only GETs against the public office API, as the dev deploy makes
      # on every train push.
      - name: Refresh Postmark data from the office API (read-only)
        env:
          POSTMARK_API: https://postmark.town/api
          BUILD_CODE_REF: ${{ github.head_ref || github.ref_name }}
          PUBLIC_CHANNEL: snapshot
        run: node tools/fetch-town.mjs
      - name: Build (snapshot, nothing deployed)
        env:
          PUBLIC_CHANNEL: snapshot
          PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

  # THE BUILT PAGES GET A PULSE (POS-670, 2026-10-17). The `test` job above
  # never builds, so every test that reads dist-town skips there: push run
  # 38412720335 passed with 100 skipped. Three built-page tests went red on
  # 10-09/10-10 and nobody saw them but the Worldkeeper's own runner, which then
  # held settlement S114 on them. This job builds the site and runs the full
  # suite against what it built, on every pull request and every push to a
  # train or main. A built-page red fails it.
  #
  # It builds from the branch's own committed data, not a fresh read of the
  # office API as `build` above does. The suite is written against the
  # committed snapshot (sync-atlas commits it to main every 30 minutes), so a
  # red here names the branch, never the town's last half hour. The first run
  # of this job did fetch, and six tests that pin the committed snapshot went
  # red on live data (PR #276's first run). `build` stays the fresh-data proof.
  #
  # The other two halves are the ones the suite reads: the world pin installed
  # exactly as package-lock.json names it (`npm ci`, never an install over an
  # old node_modules), and the Town's main checked out beside the site, as the
  # `test` job does.
  built-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (snapshot, from the committed data, nothing deployed)
        env:
          PUBLIC_CHANNEL: snapshot
          PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Check the Town out beside the site (the funding seam's other half)
        run: git clone --depth 1 https://github.com/postmark-town/postmark.git .postmark-checkout
      - name: The full suite, against the build
        shell: bash
        run: npm test -- --test-reporter=tap 2>&1 | tee suite.tap
      # A built-page test skips without dist-town, and a skip is green. So a
      # job that built and still skips them has proven nothing, and says so.
      # One skip is known and allowed BY NAME: test/rsvp.test.mjs's built-event test,
      # which skips while the committed calendar holds no events. Any other skip
      # fails the job (the `test` job's count was 100), and so does a count this
      # step cannot read: it fails closed.
      - name: The built-page tests ran (a skip is not a pass)
        shell: bash
        run: |
          SKIPPED=$(grep -E '^# skipped [0-9]+$' suite.tap | tail -1 | grep -oE '[0-9]+$' || true)
          grep -E '^# (tests|pass|fail|skipped) ' suite.tap | tr '\n' ' '; echo
          grep -E '^ *ok [0-9]+ - .*# SKIP' suite.tap || true
          if ! [[ "$SKIPPED" =~ ^[0-9]+$ ]]; then
            echo "::error::the suite's skip count could not be read ('$SKIPPED'): the built pages are not proven tested"
            exit 1
          fi
          KNOWN=$(grep -cE '^ *ok [0-9]+ - BUILT: an open event carries the form; .*# SKIP the committed calendar holds no events$' suite.tap || true)
          if [ "$SKIPPED" -gt "$KNOWN" ]; then
            echo "::error::$SKIPPED tests skipped after a build, $KNOWN of them the known calendar skip: the built pages were not all tested"
            exit 1
          fi
          # the skipped tests themselves, not only the count: none but the known one
          OTHERS=$(grep -E '^ *ok [0-9]+ - .*# SKIP' suite.tap | grep -cvE '^ *ok [0-9]+ - BUILT: an open event carries the form; .*# SKIP the committed calendar holds no events$' || true)
          if [ "$OTHERS" != "0" ]; then
            echo "::error::$OTHERS skipped tests besides the known calendar skip: the built pages were not all tested"
            exit 1
          fi
