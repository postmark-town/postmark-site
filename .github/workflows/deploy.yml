name: Deploy (snapshot -> dev; release proves the tag, the box publishes prod)

# THE CUTOVER (Keemin, 2026-08-21 night: "the site is honestly the MOST
# important. we should make the cutover tonight for merge to main -> dev,
# SNAPSHOT vs RELEASE mode with tagging, tag-to-prod").
#
# THE WEEKLY TRAIN (Keemin, 2026-08-23 pre-dawn: "a weekly branch that matches
# the planned release... always deploy to dev from that branch... a proper PR
# with me clicking Approve, which auto-deploys in RELEASE mode, getting us a
# tag for prod deployment"). Feature branches merge into train/2026-wNN; dev
# rides the train; ~weekly the train PRs into main; the founder's Approve is
# the merge word; the merge cuts release/2026-wNN[.n] and prod deploys in the
# same run. Branches are train/*, tags are release/* — the namespaces never
# collide. Main only moves by approved PR; a main push with no train name in
# its subject cuts no tag (prod just refreshes at the standing tag).
#
# Four lanes, one build:
#   - push to train/**        -> SNAPSHOT build -> dev.postmark.town webroot
#   - push to main (train PR merged; founder-approved) -> cut release tag ->
#                                RELEASE build at that tag -> prod
#   - push a release/* tag    -> RELEASE build  -> postmark.town webroot (prod)
#   - schedule (30 min)       -> RELEASE build at the LATEST release/* tag with
#                                FRESH town data -> prod. Content refresh != code
#                                release: prod's code moves only when a human
#                                approves; prod's letters keep the town's pulse.
#
# The one-writer law stands: THIS workflow is the only writer of
# /var/www/postmark-town-site/ (prod) and /var/www/postmark-dev-site/ (dev).
# Train push = dev deploy. Approved merge = tag = prod deploy. Nothing else
# touches prod.

on:
  push:
    branches: [main, "train/**"]
    tags: ["release/*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "which lane to run (snapshot -> dev, release -> prod at latest tag)"
        required: true
        default: snapshot
        type: choice
        options: [snapshot, release]

concurrency:
  group: deploy-${{ (startsWith(github.ref, 'refs/tags/release/') || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || inputs.channel == 'release') && 'prod' || 'dev' }}
  cancel-in-progress: true

jobs:
  cut-release-tag:
    # The founder's Approve, mechanized: a train PR merged into main names its
    # train in the merge subject; this cuts the matching release tag (or the
    # next .n patch) at the merge commit. A main push with no train name cuts
    # nothing. The tag push cannot re-trigger this workflow (GITHUB_TOKEN), and
    # does not need to — the deploy job below ships prod in this same run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive and cut the tag
        run: |
          SUBJECT=$(git log -1 --format=%s)
          WEEK=$(printf '%s' "$SUBJECT" | grep -oE 'train/2026-w[0-9]+' | head -1 | sed 's|train/||') || true
          if [ -z "$WEEK" ]; then
            echo "no train name in merge subject — no tag cut (prod refreshes at the standing tag)"
            exit 0
          fi
          # THE TAG IS NAMED FOR THE WEEK IT SHIPS IN, NOT FOR THE TRAIN IT CAME FROM.
          # The open train is always named for NEXT week (train/2026-w(NN+1) opens the
          # day w(NN) ships), so a mid-week ship merged from it is a patch of the
          # CURRENT week. This step used to name the tag from the train and the law
          # below refused it on every mid-week ship (2026-09-08: release/2026-w38 named
          # on a Tuesday of week 37; the run failed; w37.5 and w37.6 were cut by hand).
          # The law's own clock answers now; the judge call below stays as the confirmation.
          BASE=$(TZ=America/New_York node tools/train-week-check.mjs --tag-for "train/$WEEK")
          TAG="$BASE"
          N=0
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            N=$((N+1)); TAG="$BASE.$N"
          done
          # A TRAIN IS A WEEK'S SHIP, NAMED FOR THE WEEK IT SHIPS IN (OPERATIONS.md
          # § Release Day). This refuses a tag named for a week that has not begun
          # — the 2026-09-03 class: w37 merged and tagged on a Thursday of week 36.
          # The founder flexes single instances by name in tools/train-week-check.mjs.
          TZ=America/New_York node tools/train-week-check.mjs "$TAG"
          git config user.name "postmark-release-train"
          git config user.email "release-train@postmark.town"
          git tag -a "$TAG" -m "cut by the release train from: $SUBJECT"
          git push origin "refs/tags/$TAG"
          echo "cut $TAG at $(git rev-parse --short HEAD)"

  deploy:
    needs: cut-release-tag
    if: ${{ !cancelled() && (needs.cut-release-tag.result == 'success' || needs.cut-release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Decide the lane
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.channel }}" = "release" ] || [ "${{ github.ref }}" = "refs/heads/main" ] || case "${{ github.ref }}" in refs/tags/release/*) true;; *) false;; esac; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "webroot=/var/www/postmark-town-site/" >> "$GITHUB_OUTPUT"
          else
            echo "channel=snapshot" >> "$GITHUB_OUTPUT"
            echo "webroot=/var/www/postmark-dev-site/" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin to the latest release tag (release lane off a non-tag trigger)
        id: pin
        if: steps.lane.outputs.channel == 'release' && !startsWith(github.ref, 'refs/tags/release/')
        run: |
          git fetch --tags -q origin
          TAG=$(git tag -l 'release/*' --sort=-creatordate | head -1)
          if [ -z "$TAG" ]; then
            echo "no release/* tag exists yet — the release lane sleeps until the first one"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            git checkout "$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "building prod at $TAG"
          fi

      # Content refresh != code release, THE OTHER HALF (2026-08-24 repair):
      # fetch-town.mjs below refreshes only the API-fed data. Ferry's Daily,
      # the atlas mirrors, works and renditions are the CHECKOUT-COUPLED half —
      # plain files that sync-atlas extracts into MAIN every 30 minutes — and a
      # build pinned to the tag never saw them, so prod's letters froze at the
      # tag while this workflow's own header promised the town's pulse (caught
      # 2026-08-24: prod served Crossing 144 while main carried 146). Data from
      # main, code from the tag. Named risk, accepted: a template at the tag
      # reading a data shape that evolved on main can skew — shapes change
      # rarely and deliberately; the long-term answer is the two-tense site.
      - name: Overlay the checkout-coupled town data from main (release lane)
        id: overlay
        if: steps.lane.outputs.channel == 'release' && steps.pin.outputs.skip != 'true'
        run: |
          git checkout origin/main -- public/atelier/postmark src/data/postmark
          echo "town_data_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "town-data overlay from $(git rev-parse --short origin/main)"

      # THE WORLD PIN FOLLOWS THE BLESSING (POS-55, founder-ruled 2026-08-25).
      # The world pin was release-time CONFIG — a sha frozen into package.json
      # when the train was cut. release/2026-w35 froze 272ed4bb, cut hours
      # before settlement/S45 existed, and the keeper's pin-bump lane runs on
      # site main, which a release build never looks at. Blessing S45 changed
      # nothing prod served. The pin becomes rebuild-time DATA instead: the
      # scheduled build resolves the world's newest settlement/S<n> tag itself,
      # every 30 minutes. Data at crossing pace, code at release pace — the same
      # split the town-data overlay above already makes.
      #
      # THIRD TENSE, NAMED: the resolver itself comes from main, like the
      # workflow file it is called from (Actions reads deploy.yml off the
      # default branch on a schedule run, while `git checkout $TAG` above moved
      # the tree to the tag). Deploy machinery travels with the lane, not with
      # the release. Without this, main's workflow would call a script the
      # standing tag has never heard of. The `||` is the bootstrap: until a
      # release tag carries this change, the resolver is simply absent and the
      # pin stays at the floor, which is what every release before it shipped.
      - name: Take the world-pin resolver from main (deploy machinery, not site code)
        if: steps.lane.outputs.channel == 'release' && steps.pin.outputs.skip != 'true'
        run: |
          git checkout origin/main -- tools/resolve-world-pin.mjs tools/lib/world-pin.mjs \
            || echo "no world-pin resolver on main yet — the pin holds at the release floor"

      - uses: actions/setup-node@v4
        if: steps.pin.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.pin.outputs.skip != 'true'

      # npm ci above installed THE FLOOR — the release's frozen pin. That is
      # deliberate ordering: the fallback is not a code path to be trusted, it
      # is already on disk before anything is resolved. Three guardrails decide
      # whether it moves, and they live in tools/lib/world-pin.mjs with their
      # falsifiers in test/world-pin.test.mjs: tags only, never main tip ·
      # monotonic by settlement number, the pin never rolls backwards · on any
      # tag-resolution failure, fall back to the release's frozen pin file.
      # The resolver exits 0 on every failure — a rebuild that cannot resolve a
      # settlement is not a broken rebuild, it is one that ships the floor.
      - name: Resolve the world pin from the newest settlement tag (release lane)
        id: worldpin
        if: steps.lane.outputs.channel == 'release' && steps.pin.outputs.skip != 'true'
        run: |
          if [ -f tools/resolve-world-pin.mjs ]; then
            node tools/resolve-world-pin.mjs
          else
            echo "world-pin resolver absent at this tag — holding at the release floor"
            echo "decision=hold" >> "$GITHUB_OUTPUT"
            echo "reason=resolver-absent" >> "$GITHUB_OUTPUT"
          fi

      # The advance is an overlay on top of the floor, never a rewrite of the
      # pin file: the keeper's ceremony (bumping package.json on site main at
      # each blessing) is what keeps the floor fresh, and this must not race it.
      # The verify is a hard fail on purpose — a build that silently ships the
      # wrong world is worse than a build that does not ship. Prod keeps serving
      # the previous rsync and the next half-hour's run tries again.
      - name: Install the blessed world (settlement S${{ steps.worldpin.outputs.settlement }})
        if: steps.worldpin.outputs.decision == 'advance'
        env:
          WORLD_SHA: ${{ steps.worldpin.outputs.sha }}
        run: |
          npm install --no-audit --no-fund "postmark-world@github:postmark-town/postmark-world#$WORLD_SHA"
          node -e '
            const { readFileSync } = require("node:fs");
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const got = lock.packages["node_modules/postmark-world"]?.resolved ?? "";
            const want = process.env.WORLD_SHA;
            if (!got.endsWith("#" + want)) {
              console.error(`world pin mismatch: asked for ${want}, lock resolved ${got}`);
              process.exit(1);
            }
            console.log(`world pinned at ${want}`);
          '
          echo "world: floor ${{ steps.worldpin.outputs.floor_sha }} (S${{ steps.worldpin.outputs.floor_settlement }}) -> S${{ steps.worldpin.outputs.settlement }} $WORLD_SHA"

      # fetch-town.mjs also writes /data/pin.json (tools/lib/world-pin-publish.mjs
      # — the world sha this site is pinned to, the one fact the office cannot
      # derive about the site). That file reads BUILD_CODE_REF and PUBLIC_CHANNEL
      # from the environment, and until 2026-09-08 this step passed NEITHER — so
      # `code_ref` was null on every build that ever wrote the file, carrying its
      # own honest note saying so, and the lane was unnameable. A freshness stamp
      # that cannot name its own source is the thing it exists to prevent. Both
      # come from the same places the build stamp takes them, so the two stamps
      # cannot disagree about which ref and which lane built this site.
      - name: Refresh Postmark data from office API
        if: steps.pin.outputs.skip != 'true'
        env:
          POSTMARK_API: https://postmark.town/api
          BUILD_CODE_REF: ${{ steps.pin.outputs.tag || github.ref_name }}
          PUBLIC_CHANNEL: ${{ steps.lane.outputs.channel }}
        run: node tools/fetch-town.mjs

      # THE SETTLEMENT NUMBER ONLY EXISTS UP HERE (postmark#2923). The staged
      # world-state export is stamped with the settlement it reflects, and the
      # step that makes the copy — world-engine-island's `stage()` — runs inside
      # `npm run build`, where the resolver's answer was simply not in the
      # process. This is that one line of plumbing.
      #
      # It is the STRONG source on purpose: `settlement` is correct in both of
      # the resolver's branches by construction — on an advance it is the tag
      # that was installed, and on a hold it is `floorSettlement`, an ancestry
      # walk, which is the only thing that answers correctly when the floor is
      # pinned to a commit downstream of its own tag. Empty on the snapshot lane
      # (which resolves no tag at all) and on a skipped run, and empty is a
      # state the stamp handles by name rather than by guessing.
      - name: Build (${{ steps.lane.outputs.channel }})
        if: steps.pin.outputs.skip != 'true'
        env:
          PUBLIC_CHANNEL: ${{ steps.lane.outputs.channel }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          PUBLIC_WORLD_SETTLEMENT: ${{ steps.worldpin.outputs.settlement }}
        run: npm run build            # town -> dist-town/

      # The deployed site says what it was built from, so a watcher can ask
      # whether it is current without guessing. Emitted AFTER the build and into
      # dist-town/ so the rsync below carries it; and after every checkout, so
      # `git rev-parse HEAD` names the code that was actually compiled rather
      # than the commit that triggered the run (on the release lane those differ
      # — the pin step checks out the tag and github.sha does not follow it).
      #
      # Two shas because the site has two tenses: code from the release tag,
      # town data overlaid from main. See tools/build-stamp.mjs for the whole
      # argument, and the 2026-08-24 freeze in the overlay step's comment above
      # for what a one-sha stamp cannot express.
      # The stamper is deploy machinery like the world-pin resolver above: the
      # release lane's tree sits at the tag, which predates this file, so take
      # it from main — and if it is somehow still absent, skip with a word
      # rather than fail the deploy (the sentinel reads absence as UNKNOWN,
      # never as green).
      - name: Take the build stamper from main (deploy machinery, not site code)
        if: steps.lane.outputs.channel == 'release' && steps.pin.outputs.skip != 'true'
        run: |
          git checkout origin/main -- tools/build-stamp.mjs             || echo "no build stamper on main yet — /build.json stays absent"
      - name: Stamp the build (/build.json)
        if: steps.pin.outputs.skip != 'true'
        env:
          PUBLIC_CHANNEL: ${{ steps.lane.outputs.channel }}
          BUILD_CODE_REF: ${{ steps.pin.outputs.tag || github.ref_name }}
          BUILD_TOWN_DATA_SHA: ${{ steps.overlay.outputs.town_data_sha }}
          # The settlement tag's NAME when the resolver advanced to one; empty on
          # hold (the floor is a sha, not necessarily a tag) and on the snapshot
          # lane (no resolver). The stamper reads the world SHA itself from this
          # tree's package-lock.json — the receipt, not a claim passed by hand.
          BUILD_WORLD_REF: ${{ steps.worldpin.outputs.decision == 'advance' && format('settlement/S{0}', steps.worldpin.outputs.settlement) || '' }}
        run: |
          if [ -f tools/build-stamp.mjs ]; then
            node tools/build-stamp.mjs --out dist-town/build.json
          else
            echo "stamper absent at this ref — /build.json not emitted (sentinel reads UNKNOWN)"
          fi

      # ONE WRITER OWNS PROD (founder-ruled 2026-08-27, completed 2026-08-30).
      # The 08-27 retirement (3314921a) moved prod content to the box's
      # site-refresh timer and said "GitHub Actions keeps only code releases" —
      # but left this rsync, so every release shipped a repo-stale content
      # window over the box's fresh build (bitten live 2026-08-30: prod
      # time-traveled to 08-27 data for half an hour). Now the release lane
      # BUILDS (proving the tag) and stops: the box sees the new release tag
      # at its next :10/:40 tick and publishes with fresh content, ≤30 min.
      # The dev lane still rsyncs — dev.postmark.town has no box publisher.
      - name: Rsync to EC2 (${{ steps.lane.outputs.webroot }})
        if: steps.pin.outputs.skip != 'true' && steps.lane.outputs.channel != 'release'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          WEBROOT: ${{ steps.lane.outputs.webroot }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist-town/ "$USER@$HOST:$WEBROOT"
          echo "${{ steps.lane.outputs.channel }}: deployed $(du -sh dist-town | cut -f1) to $HOST:$WEBROOT"
