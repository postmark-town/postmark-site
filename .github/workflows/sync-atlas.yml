name: Sync Postmark atlas

# The town draws its own map (postmark-town/postmark, PROJECTS/build-the-town/atlas)
# and Ferry rewrites his Daily (TOWN_BULLETIN/ferrys-daily.html) every round.
# This job keeps both hosted copies current: check out the town repo, run the
# sync script (rewrites repo-relative refs to local downscaled copies /
# GitHub links), and if anything changed, commit + dispatch a deploy.
#
# No secrets live in the town repo — it merges resident PRs, so it must never
# hold tokens. This side polls instead; the ferry runs twice a day, so a
# half-hour cadence is generous. workflow_dispatch is the instant path.
#
# Moved here from keeminlee/starforge-atelier UNMODERNIZED, on purpose: the
# extraction changes where this runs, not how (gold plan
# postmark-site-extraction § NOT in scope — modernizing the sync in the same
# window would blur which change broke what). One line differs from the
# atelier's copy: the-resident-herbarium is NOT committed here. That tree is the
# atelier's own asset and its slimmed sync stays atelier-side (F2).
#
# BRANCH PROTECTION — main requires a PR + review, and this job pushes straight
# to main. Personal repos cannot add the GitHub Actions app as a ruleset bypass
# actor (API 422: "must be part of the ruleset source"; the UI picker omits it
# for the same reason), so the push authenticates with a WRITE DEPLOY KEY
# (secret SYNC_DEPLOY_KEY, checkout ssh-key below) and the ruleset's bypass
# class is "Deploy keys". If a scheduled run ever stops landing, that key +
# bypass pair is the first thing to check: a silently blocked cron starves
# Ferry's Daily and only ever surfaces as staleness.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-atlas
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # push via the write deploy key — the ruleset's deploy-key bypass
          # is what lets the scheduled commit land on protected main
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - uses: actions/checkout@v4
        with:
          repository: postmark-town/postmark
          path: .postmark-checkout

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sharp (image resizing)
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5

      - name: Refresh checkout-coupled Postmark media
        env:
          # read-only: the extractor asks the GitHub API for PR states on the
          # public town repo (doorstep bundles). Degrades to prs:null without it.
          GH_TOKEN: ${{ github.token }}
          # THE DOORSTEP BUNDLES ARE THE OFFICE'S OWN ANSWER now (2026-09-09):
          # the extractor mirrors GET /doorstep/<handle> per resident instead of
          # building a second doorstep out of the checkout. Same origin, same
          # runner, and no key: these are public reads. The step below has called
          # this API from this job since the API-fed build landed, which is what
          # says it is reachable from here. If the office cannot be reached the
          # extractor keeps each previous file and says so; it never falls back
          # to a locally-built bundle.
          POSTMARK_API: https://postmark.town/api
        run: node tools/extract-town.mjs --town .postmark-checkout

      - name: Refresh Postmark data from office API
        env:
          POSTMARK_API: https://postmark.town/api
        run: node tools/fetch-town.mjs --town .postmark-checkout

      # Renditions are the one piece of town content that is FILES in the town
      # repo rather than anything the office API serves, so they can only ride
      # the checkout — which this job already has. Without this step, "merged =
      # approved = eligible to appear" (PROJECTS/resident-page-renditions/
      # README.md) is connected to nothing, and a merged rendition only reaches
      # the site if a human remembers to run the script locally and commit its
      # output. Three did not, for days (postmark-town/postmark#603).
      - name: Sync approved renditions
        run: node tools/sync-renditions.mjs --town .postmark-checkout

      # Registered Hearth entries (POS-959): the town repo is their review gate, as for renditions; this copies
      # merged entries into src/data/postmark/hearths.json, which the commit step below already stages.
      - name: Sync registered Hearth entries
        run: node tools/sync-hearths.mjs --town .postmark-checkout

      - name: Commit + deploy if the town changed
        run: |
          git add public/atelier/postmark/atlas public/atelier/postmark/daily \
                  public/atelier/postmark/works \
                  public/atelier/postmark/media public/atelier/postmark/data \
                  public/atelier/postmark/renditions \
                  src/data/postmark
          if git diff --cached --quiet; then
            echo "town unchanged — nothing to do"
            exit 0
          fi
          git config user.name "atlas-sync"
          git config user.email "atlas-sync@users.noreply.github.com"
          git commit -m "postmark: auto-sync the town (data + atlas + daily + mirrors)"
          # A code merge landing on main during this job's ~90s window makes a
          # bare push lose the race (twice on 2026-08-25 alone — 22:42 and
          # 23:39, each a red run and a sentinel alert for a healthy town).
          # This job only ever ADDS its own auto-sync commit on top of whatever
          # main became, so rebase-and-retry is always safe here.
          for i in 1 2 3; do
            git push && exit 0
            echo "push lost the race (attempt $i) — rebasing onto fresh main"
            git pull --rebase origin main
          done
          git push
          # unlike a GITHUB_TOKEN push, a deploy-key push DOES trigger the push
          # workflow — deploy.yml fires from this push itself, so the old
          # explicit dispatch is gone rather than left to double-run it.
